// Some cfgs ported from Dark Interval

// ===========
//  ENGINE SETTINGS
// ============

// Necessary crash-fix for larger maps
r_hunkalloclightmaps 0

// Depthtexture isn't used on player flashlight due to perf hit, but NPC
// and scenic flashlight are designed with it in mind
r_flashlightdepthtexture 1

// Percentage of how much to cut framerate when the game's window isn't in focus.
// (alt-tab'ed out of game)
// e. g. 50 means framerate will be cut in half. 0 means no cutting framerate.
engine_no_focus_sleep 10

// These files are useless in singleplayer and just clutter up the mod's folder.
sv_logdownloadlist 0

// Disable stats
sv_nostats 1

// Preloading seems to make loading times longer (when it should do the opposite... sigh.)
cl_forcepreload 0

// Needed for NPCs with flashlight
r_flashlightdepthtexture 1

// Cap the FPS
fps_max 60

// ===========
//  GAME & MAPBASE SETTINGS
// ============

// Fixes HL2 Combine soldiers, Metrocops, hunters, and striders using the enemy's actual position instead of last known position
ai_enemy_memory_fixes 1

// Allows NPCs to tell squad members when an enemy is eluded
ai_squad_broadcast_elusion 1

ai_death_pose_enabled 1
ai_death_pose_server_enabled 1
ai_force_serverside_ragdoll 0
ragdoll_always_allow_use 0

// ===========
//  SQUAD SETTINGS
// ============

// If a model is named 'chefhat' then it'd appear over a squad member's head
npc_citizen_insignia 0
npc_citizen_auto_player_squad 1
player_squad_transient_commands 1
npc_citizen_auto_player_squad_allow_use 0

// ===========
//  CLIENT SETTINGS
// ============

// Allows players to cast RTT shadows even if they're in first person.
cl_player_allow_firstperson_rttshadows 1

// Allows players to receive projected textures if they're non-local or in third person.
cl_player_allow_thirdperson_projtex 1

// ===========
//  NODEGRAPH
// ============

// Fix "node graph out of date"
// Mappers and Modders: You should set this to 0 to compile node graphs!!
ai_norebuildgraph 1
